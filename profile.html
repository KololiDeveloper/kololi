<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile - Kololi</title>
<style>body{font-family:Roboto,Arial,sans-serif;margin:0;background:#f4f9f8;color:#1f2d2b;text-align:center}
.top{height:120px;background:linear-gradient(135deg,#4cb97a,#2f9fb4)}
.av{width:96px;height:96px;border-radius:50%;margin:-48px auto 0;background:#fff;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#2f7d4f}
.av img{width:100%;height:100%;object-fit:cover}
h2{margin:12px 0 2px}#em{color:#5b6b68;margin:0 0 16px;word-break:break-all;padding:0 16px}
.stats{display:flex;gap:10px;margin:0 14px 16px}
.stats div{flex:1;border-radius:14px;padding:14px 4px;color:#fff;font-weight:600}
.stats b{display:block;font-size:26px}
.a{background:#4cb97a}.b{background:#2f9fb4}.c{background:#e9b949}
.menu{margin:0 14px;background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(20,60,50,.1);text-align:left}
.menu a,.menu button{display:block;width:100%;box-sizing:border-box;padding:16px;border:0;border-bottom:1px solid #eef3f1;background:none;font:600 16px Roboto,Arial,sans-serif;color:#1f2d2b;text-decoration:none;text-align:left}
.menu button{color:#b04040;border-bottom:0}
#msg{margin:14px;color:#b04040}</style></head><body>
<div class="top"></div>
<div class="av" id="av">K</div>
<h2>My Profile</h2><p id="em">Loading...</p>
<div class="stats"><div class="a"><b id="n1">-</b>Downloads</div><div class="b"><b id="n2">-</b>Saved</div><div class="c"><b id="n3">-</b>Uploads</div></div>
<div class="menu"><a href="/library.html">My Library</a><a href="/upload.html">Upload a PDF</a><button onclick="out()">Log out</button></div>
<p id="msg"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
let db;
const msg=t=>document.getElementById("msg").textContent=t;
async function init(){
const page=await(await fetch("/index.html")).text();
const m=page.match(/eyJ[\w-]+\.[\w-]+\.[\w-]+/);
if(!m)return msg("Setup problem: key not found.");
db=supabase.createClient("https://xskidmappzknphgjcsrf.supabase.co",m[0]);
const{data}=await db.auth.getSession();
if(!data.session){document.getElementById("em").innerHTML='Please <a href="/index.html">log in</a> first.';return}
const u=data.session.user;
document.getElementById("em").textContent=u.email;
const av=document.getElementById("av");av.textContent="";
const img=new Image();img.src="/kd-logo-512.png";img.onload=()=>av.appendChild(img);img.onerror=()=>{av.textContent=u.email.charAt(0).toUpperCase()};
const c=async(t,f)=>{let q=db.from(t).select("*",{count:"exact",head:true});if(f)q=q.eq(f[0],f[1]);const r=await q;return r.count||0};
document.getElementById("n1").textContent=await c("downloads");
document.getElementById("n2").textContent=await c("favorites");
document.getElementById("n3").textContent=await c("materials",["uploaded_by",u.id])}
async function out(){await db.auth.signOut();location.href="/index.html"}
init();
</script>
<script src="/nav.js"></script>
</body></html>
