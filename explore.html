<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore - Kololi</title>
<style>html body{padding-top:0!important}#kgs{display:none!important}
body{font-family:Roboto,Arial,sans-serif;margin:0;background:#f4f9f8;color:#1f2d2b}
.top{background:linear-gradient(135deg,#4cb97a,#2f9fb4);padding:16px 14px 12px;color:#fff}
.top h2{margin:0 0 10px}
.bar{display:flex;background:#fff;border-radius:999px;padding:0 6px 0 14px}
.bar input{flex:1;border:0;outline:0;padding:12px 6px;font-size:16px;background:none;min-width:0}
.bar button{border:0;background:none;font-size:18px;padding:8px 10px}
.g{display:none;margin:12px 14px 0;padding:12px;border-radius:12px;background:#fff;color:#1d7f73;font-weight:600;text-align:center;text-decoration:none;box-shadow:0 2px 10px rgba(20,60,50,.1)}
h3{margin:18px 14px 8px;font-size:16px}
.c{background:#fff;border-radius:12px;margin:0 14px 10px;padding:12px;box-shadow:0 2px 10px rgba(20,60,50,.1)}
.c b{display:block;font-size:15px;line-height:1.3}.c small{display:block;color:#5b6b68;margin:2px 0 6px}
.c p{margin:0;font-size:14px;line-height:1.45;color:#33423f}
.c a{display:inline-block;margin-top:8px;margin-right:8px;padding:7px 14px;border-radius:10px;background:#e8f4f0;color:#1d7f73;font-weight:600;font-size:13px;text-decoration:none}
.empty{margin:0 14px;color:#5b6b68;font-size:14px}
html.kdark .c p{color:#cfe3dd}html.kdark .g{background:#182a26;color:#7ee0a3}</style></head><body>
<div class="top"><h2>Explore</h2><div class="bar"><input id="q" placeholder="Search any topic, author or concept"><button onclick="run()">🔍</button></div></div>
<a id="gg" class="g" target="_blank">Open full Google results</a>
<h3>Encyclopedia</h3><div id="wiki"><p class="empty">Type a topic above to begin.</p></div>
<h3>Research papers</h3><div id="pap"></div>
<h3>Free books</h3><div id="bks"></div>
<script>
const $=id=>document.getElementById(id);
function card(title,sub,text,url,label){const c=document.createElement("div");c.className="c";
const b=document.createElement("b");b.textContent=title;c.appendChild(b);
if(sub){const s=document.createElement("small");s.textContent=sub;c.appendChild(s)}
if(text){const p=document.createElement("p");p.textContent=text;c.appendChild(p)}
const a=document.createElement("a");a.href=url;a.target="_blank";a.textContent=label||"Read";c.appendChild(a);return c}
function note(id,t){const e=$(id);e.innerHTML="";const p=document.createElement("p");p.className="empty";p.textContent=t;e.appendChild(p)}
async function wiki(t){
const r=await fetch("https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(t)+"&gsrlimit=6&prop=extracts&exintro=1&explaintext=1&exlimit=max&format=json&origin=*");
const d=await r.json();const pages=d.query?Object.values(d.query.pages).sort((a,b)=>a.index-b.index):[];
const el=$("wiki");el.innerHTML="";if(!pages.length)return note("wiki","No encyclopedia results.");
pages.forEach(p=>{const ex=p.extract||"";el.appendChild(card(p.title,"Wikipedia",ex.slice(0,420)+(ex.length>420?"...":""),"https://en.m.wikipedia.org/wiki/"+encodeURIComponent(p.title.replace(/ /g,"_")),"Read full article"))})}
async function papers(t){
const r=await fetch("https://api.openalex.org/works?filter=open_access.is_oa:true&per_page=5&search="+encodeURIComponent(t));
const d=await r.json();const rs=d.results||[];const el=$("pap");el.innerHTML="";if(!rs.length)return note("pap","No free papers found.");
rs.forEach(w=>{const au=(w.authorships||[]).map(x=>x.author&&x.author.display_name).filter(Boolean);const oa=w.open_access&&w.open_access.oa_url;const url=oa||w.doi||w.id;
el.appendChild(card(w.display_name||"Untitled",(au[0]||"Unknown author")+(au.length>1?" et al.":"")+" - "+(w.publication_year||""),"",url,"Read paper"))})}
async function books(t){
const r=await fetch("https://gutendex.com/books?languages=en&search="+encodeURIComponent(t));
const d=await r.json();const rs=(d.results||[]).slice(0,5);const el=$("bks");el.innerHTML="";if(!rs.length)return note("bks","No free books found.");
rs.forEach(b=>{const a=(b.authors&&b.authors[0])?b.authors[0].name.split(", ").reverse().join(" "):"Unknown author";
const f=b.formats||{};const k=Object.keys(f).find(x=>x.indexOf("text/html")===0);const u=(k?f[k]:"https://www.gutenberg.org/ebooks/"+b.id).replace(/^http:/,"https:");
el.appendChild(card(b.title,a,"",u,"Read book"))})}
function run(){const t=$("q").value.trim();if(!t)return;
$("gg").style.display="block";$("gg").href="https://www.google.com/search?q="+encodeURIComponent(t);
if(!navigator.onLine){["wiki","pap","bks"].forEach(i=>note(i,"You are offline."));return}
["wiki","pap","bks"].forEach(i=>note(i,"Loading..."));
[["wiki",wiki],["pap",papers],["bks",books]].forEach(x=>{x[1](t).catch(()=>note(x[0],"Could not load this section."))})}
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
const pq=new URLSearchParams(location.search).get("q");if(pq){$("q").value=pq;run()}
</script>
<script src="/nav.js"></script>
</body></html>
