<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kololi</title>
<style>body{font-family:sans-serif;max-width:500px;margin:auto;padding:16px}input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}li{margin:10px 0;list-style:none;border:1px solid #ccc;padding:10px;border-radius:8px}</style><meta name="description" content="Kololi: free English and Literature study materials for University of Nairobi students. Search by course code and download PDFs."><meta name="google-site-verification" content="oaP00tdwB_tCFVpFO2DjJPyVTHVy465XoBn5cDzzYTQ" /><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0f766e">
</head><body>
<h1>Kololi</h1><p>English and Literature materials, free.</p><p><a href="/upload.html">Upload a PDF</a></p><p><a href="/library.html">My Library</a></p>
<div id="auth"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ characters)"><button onclick="signUp()">Sign up</button><button onclick="logIn()">Log in</button></div>
<div id="app" style="display:none"><button onclick="logOut()">Log out</button><input id="q" placeholder="Course code or title"><button onclick="search()">Search</button><ul id="results"></ul></div>
<p id="msg"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db=supabase.createClient("https://xskidmappzknphgjcsrf.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhza2lkbWFwcHprbnBoZ2pjc3JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Nzg0NTEsImV4cCI6MjEwODM1NDQ1MX0.9QYjHZ07UT7WFOlyTJI1ldIM_WNlnKce_o8Ke6vJ-Nk");
const msg=t=>document.getElementById("msg").textContent=t;
async function signUp(){const{error}=await db.auth.signUp({email:email.value,password:pass.value});msg(error?error.message:"Check your email and tap the verification link, then log in.")}
async function logIn(){const{error}=await db.auth.signInWithPassword({email:email.value,password:pass.value});if(error)msg(error.message);else show()}
async function logOut(){await db.auth.signOut();show()}
async function show(){const{data}=await db.auth.getSession();auth.style.display=data.session?"none":"block";app.style.display=data.session?"block":"none"}
async function search(){const n=s=>(s||"").toLowerCase().replace(/\s+/g,"");const t=n(q.value);const{data,error}=await db.from("materials").select("*").eq("status","approved");if(error)return msg(error.message);const list=data.filter(m=>n(m.title).includes(t)||n(m.course_code).includes(t));results.innerHTML=list.length?"":"No materials found.";list.forEach(m=>{const li=document.createElement("li");li.textContent=m.title+" ("+(m.course_code||"")+") ";const b=document.createElement("button");b.textContent="Download";b.onclick=()=>get(m);li.appendChild(b);results.appendChild(li)})}
async function get(m){const{data,error}=await db.storage.from("pdfs").createSignedUrl(m.file_path,60);if(error)return msg(error.message);await db.from("downloads").insert({material_id:m.id});window.open(data.signedUrl,"_blank")}
show();
</script></body></html>
