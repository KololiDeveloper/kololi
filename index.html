<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile - Kololi</title>
<style>body{font-family:Roboto,Arial,sans-serif;margin:0;background:#f4f9f8;color:#1f2d2b;text-align:center}
.top{height:110px;background:linear-gradient(135deg,#4cb97a,#2f9fb4)}
.av{width:90px;height:90px;border-radius:50%;margin:-45px auto 0;background:#fff;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#2f7d4f}
.av img{width:100%;height:100%;object-fit:cover}
#em{color:#5b6b68;padding:0 16px;word-break:break-all}
.menu{margin:16px 14px;background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(20,60,50,.1);text-align:left}
.menu a,.menu button{display:block;width:100%;box-sizing:border-box;padding:16px;border:0;border-bottom:1px solid #eef3f1;background:none;font:600 16px Roboto,Arial,sans-serif;color:#1f2d2b;text-decoration:none;text-align:left}
.menu button{color:#b04040;border-bottom:0}
#msg{margin:14px;color:#b04040}</style></head><body>
<div class="top"></div><div class="av" id="av">K</div>
<h2>My Profile</h2><p id="em">Loading...</p>
<div class="menu"><a href="/home.html">Home</a><a href="/library.html">My Library</a><a href="/upload.html">Upload a PDF</a><button onclick="out()">Log out</button></div>
<p id="msg"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
let db;
const $=id=>document.getElementById(id);
async function init(){
const page=await(await fetch("/index.html")).text();
const m=page.match(/eyJ[\w-]+\.[\w-]+\.[\w-]+/);
if(!m){$("msg").textContent="Setup problem: key not found.";return}
db=supabase.createClient("https://xskidmappzknphgjcsrf.supabase.co",m[0]);
const{data}=await db.auth.getSession();
if(!data.session){$("em").innerHTML='Please <a href="/index.html">log in</a> first.';return}
const u=data.session.user;
$("em").textContent=u.email;
const av=$("av");av.textContent="";
const img=new Image();img.src="/kd-logo-512.png";img.onload=()=>av.appendChild(img);img.onerror=()=>{av.textContent=u.email.charAt(0).toUpperCase()}}
async function out(){await db.auth.signOut();location.href="/index.html"}
init();
</script>
</body></html>
